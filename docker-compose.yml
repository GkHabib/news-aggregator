services:
  web:
    build:
      context: .
      args:
        ENABLE_MOCK_DATA: ${ENABLE_MOCK_DATA:-false}
    pull_policy: build # rebuild the image on every `up` so source changes are picked up
    env_file: .env # API keys, read by nginx at runtime (never baked into the image)
    ports:
      - "3000:80"
